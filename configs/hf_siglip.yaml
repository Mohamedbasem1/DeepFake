input:
  recursive: true
  image_extensions: [".jpg", ".jpeg", ".png", ".webp", ".bmp", ".tif", ".tiff"]
  video_extensions: [".mp4", ".avi", ".mov", ".mkv", ".webm"]
  max_video_frames: 16

model:
  name: hf_siglip
  # Replace this with the selected Hugging Face model ID on Lightning AI.
  # Prefer a model card trained for binary real/fake or AI-generated image detection.
  model_id: prithivMLmods/Deep-Fake-Detector-v2-Model
  threshold: 0.5
  device: auto
  half_precision: true
  tta: ["none", "hflip"]
  # Set this if the model's id2label metadata does not clearly name the fake class.
  # fake_label_index: 1

submission:
  id_from: name
  columns:
    id: full_secret_name
    score:
    label: prediction
  labels:
    real: 0
    fake: 1
